<h3>Available Foods</h3>
<div class="d-flex flex-wrap gap-3">
  @for (i of foodservice.foods(); track i.id) {
  <div class="card" style="width: 18rem;">
    <div class="card-body">
      <h5 class="card-title">{{i.name}}</h5>
      <p class="card-text">{{i.category}}</p>
      <p class="card-text">Rs {{i.price}}</p>
      <a href="#" class="btn btn-primary" (click)="viewDetailsFood(i)">View Details</a>
      <a href="#" class="btn btn-primary" (click)="addFood(i)">Add To Cart</a>
    </div>
  </div>
  }
</div>
