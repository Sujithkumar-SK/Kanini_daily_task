<nav class="navbar">
  <div class="nav-brand">
    <h2>Job Portal</h2>
  </div>
  <div class="nav-links">
    <a routerLink="/login" *ngIf="!auth.isLoggedIn()" class="nav-link">Login</a>
    <a routerLink="/register" *ngIf="!auth.isLoggedIn()" class="nav-link">Register</a>
    <span *ngIf="auth.isLoggedIn()" class="user-info">
      Welcome, {{ auth.getCurrentUser()?.name }}
    </span>
    <a (click)="logout()" *ngIf="auth.isLoggedIn()" class="nav-link logout-btn">Logout</a>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
